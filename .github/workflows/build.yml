name: build
on:
  pull_request_target:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: probe
        if: always()
        run: |
          echo "PROBE|action=$(jq -r .action "$GITHUB_EVENT_PATH")"
          echo "PROBE|event_name=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
          EL="${{ github.event.pull_request.head.sha }}"
          echo "PROBE|expr=[$EL]"
          echo "PROBE|expr_len=${#EL}"
          echo "PROBE|expr_head_repo_id=[${{ github.event.pull_request.head.repo.id }}]"
          echo "PROBE|expr_repository_id=[${{ github.event.repository.id }}]"
          echo "PROBE|expr_merge_commit_sha=[${{ github.event.pull_request.merge_commit_sha }}]"
          echo "PROBE|expr_head_ref=[${{ github.event.pull_request.head.ref }}]"
          echo "PROBE|payload_bytes=$(wc -c < "$GITHUB_EVENT_PATH")"
          echo "--- jq file side ---"
          jq -c '{action, head_sha: .pull_request.head.sha, head_sha_len: (.pull_request.head.sha|length), head_repo_id: .pull_request.head.repo.id, repository_id: .repository.id, merge_commit_sha: .pull_request.merge_commit_sha, head_ref: .pull_request.head.ref, draft: .pull_request.draft, body_len: (.pull_request.body|length), pr_state: .pull_request.state}' "$GITHUB_EVENT_PATH" || echo "JQ_PARSE_FAIL"
          echo "--- event keys ---"
          jq -r 'keys|join(",")' "$GITHUB_EVENT_PATH" || echo "JQ_PARSE_FAIL"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: bash ./ci/build.sh
      - name: post
        if: always()
        run: |
          echo "POST|git HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'no-git')"
          echo "POST|idtoken_url=${ACTIONS_ID_TOKEN_REQUEST_URL:-EMPTY}"
