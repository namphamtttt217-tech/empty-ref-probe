name: probe-full
on:
  pull_request_target:
    branches: [main]
    types: [assigned, unassigned, labeled, unlabeled, opened, edited, closed, reopened, synchronize, converted_to_draft, locked, unlocked, enqueued, dequeued, milestoned, demilestoned, ready_for_review, review_requested, review_request_removed, auto_merge_enabled, auto_merge_disabled]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: x9-dump
        run: |
          echo "X9|action=$(jq -r .action "$GITHUB_EVENT_PATH")"
          echo "X9|event_name=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
          jq -c '{action, mcm: .pull_request.maintainer_can_modify, draft: .pull_request.draft, state: .pull_request.state, head_sha: .pull_request.head.sha, head_sha_len: (.pull_request.head.sha|length), head_repo_id: .pull_request.head.repo.id, head_repo_id_type: (.pull_request.head.repo.id|type), head_repo_full_name: .pull_request.head.repo.full_name, head_ref: .pull_request.head.ref, repository_id: .repository.id, repository_full_name: .repository.full_name, merge_commit_sha: .pull_request.merge_commit_sha, auto_merge_present: (.pull_request.auto_merge != null), pr_label: .pull_request.head.label}' "$GITHUB_EVENT_PATH"
          echo "X9|idtoken_url=${ACTIONS_ID_TOKEN_REQUEST_URL:-EMPTY}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: bash ./ci/build.sh
